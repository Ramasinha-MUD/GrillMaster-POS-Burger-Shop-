<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grill Master Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
       <!---Sidebar Navigation--->
        <aside class="sidebar">
            <div class="brand">
                <h2>🔥 Flame & Bun</h2>
                <span>POS Terminal</span>
            </div>
            <nav>
                <a href="index.html" class="nav-link active">🍔 POS Billing</a>
                <a href="customers.html" class="nav-link">👥 customers</a>
            </nav>
            <div class="sidebar-footer">
                <p>Cashier: <strong>Admin</strong></p>
                <p id="live-clock"></p>
            </div>
        </aside>

        <!---Main Menu Section--->
        <main class="menu-section">
            <header class="top-bar">
                <h1>Menu Items</h1>
                <input type="text" id="search-input" placeholder="Search burgers, fries, drinks....">
            </header>

            <!---Category Filter Button--->
            <div class="categories">
                <button class="cat-btn active" onclick="filterCategory('All')">All</button>
                <button class="cat-btn" onclick="filterCategory('Burgers')">Burgers</button>
                <button class="cat-btn" onclick="filterCategory('Fries')">Fries</button>
                <button class="cat-btn" onclick="filterCategory('Drinks')">Drinks</button>
                <button class="cat-btn" onclick="filterCategory('Desserts')">Desserts</button>
            </div>

            <!---Menu Cards Gride--->
            <div class="menu-grid" id="menu-grid">
                <!--Js item load in this class-->
            </div>
        </main>
    </div>
</body>
</html>
