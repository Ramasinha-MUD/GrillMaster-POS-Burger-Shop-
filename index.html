<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grill Master Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
       <!---Sidebar Navigation--->
        <aside class="sidebar">
            <div class="brand">
                <h2>🔥 Flame & Bun</h2>
                <span>POS Terminal</span>
            </div>
            <nav>
                <a href="index.html" class="nav-link active">🍔 POS Billing</a>
                <a href="customers.html" class="nav-link">👥 Customers</a>
            </nav>
            <div class="sidebar-footer">
                <p>Cashier: <strong>Admin</strong></p>
                <p id="live-clock"></p>
            </div>
        </aside>

        <!---Main Menu Section--->
        <main class="menu-section">
            <header class="top-bar">
                <h1>Menu Items</h1>
                <input type="text" id="search-input" placeholder="Search burgers, fries, drinks....">
            </header>

            <!---Category Filter Button--->
            <div class="categories">
                <button class="cat-btn active" onclick="filterCategory('All')">All</button>
                <button class="cat-btn" onclick="filterCategory('Burgers')">Burgers</button>
                <button class="cat-btn" onclick="filterCategory('Fries')">Fries</button>
                <button class="cat-btn" onclick="filterCategory('Drinks')">Drinks</button>
                <button class="cat-btn" onclick="filterCategory('Desserts')">Desserts</button>
            </div>

            <!---Menu Cards Gride--->
            <div class="menu-grid" id="menu-grid">
                <!--Js item load in this class-->
            </div>
        </main>

        <!---Right Side Order Cart / Billing--->
        <section class="cart-section">
            <div class="cart-header">
                <h2>Current Order</h2>
                <button class="clear-btn" onclick="clearCart()">Clear</button>
            </div>

            <div class="customer-select">
                <label for="customer-dropdown">Customer:</label>
                <select id="customer-dropdown">
                    <option value="Walk-in Customer">Walk-in Customer</option>
                </select>
            </div>

            <div class="cart-items" id="cart-items">
                <p class="empty-msg">Cart is empty. Select items to start.</p>
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">Rs.0.00</span>
                </div>
                <div class="summary-row">
                    <span>Discount (%):</span>
                    <input type="number" id="discount-input" value="0" min="0" max="100" oninput="updateTotals()">
                </div>
                <div class="summary-row total-row">
                    <span>Total:</span>
                    <span id="grand-total">Rs.0.00</span>
                </div>
                <button class="checkout-btn" onclick="checkoutOrder()">Complete order & Print</button>
            </div>
        </section>
    </div>

    <!---Receipt Modal--->
    <div id="receipt-modal" class="modal hidden">
        <div class="modal-content">
            <h3>🧾 Order Receipt</h3>
            <div id="receipt-details"></div>
            <button onclick="closeModal()" class="checkout-btn">Done</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/pos.js"></script>
</body>
</html>
