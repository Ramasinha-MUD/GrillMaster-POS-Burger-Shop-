<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grill Master Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--Add customer page layout and sidebar navigation-->
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h2>🔥Flame & Bun</h2>
                <span>POS Terminal</span>
            </div>
            <nav>
                <a href="index.html" class="nav-link">🍔 POS Billing</a>
                <a href="customers.html" class="nav-link active">👥 Customers</a>
            </nav>
        </aside>

        <main class="menu-section" style="grid-column: span 2;">
            <header class="top-bar">
                <h1>Customer Management</h1>
            </header>

            <!--Add customer form-->
            <div class="form-card">
                <h3>Add New Customer</h3>
                <form id="customer-form" class="customer-form">
                    <input type="text" id="cust-name" placeholder="Customer name" required>
                    <input type="tel" id="cust-phone" placeholder="Phone number (07X XXXXXXX)" required>
                    <input type="email" id="cust-email" placeholder="Email (Optional)">
                    <button type="submit" class="checkout-btn">Save Customer</button> 
                </form>
            </div>

            <!--Customer Table-->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone number</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="customer-table-body">
                        <!--customers load in this-->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/customers.js"></script>
</body>
</html>
